name: Build Ascendara

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean electron-builder cache
        run: rm -rf ~/.cache/electron-builder/appimage

      - name: Install dependencies
        run: yarn install

      # Keep this before the tests so a retired privileged bridge cannot quietly
      # return while its runtime behavior still happens to pass unit tests.
      - name: Audit renderer security boundaries
        run: node scripts/security-audit.cjs

      # Syntax-check the files that sit on the renderer/main privilege boundary before
      # running tests. A malformed preload is much easier to diagnose here than as a
      # blank Electron window later in the build.
      - name: Check Electron security syntax
        run: |
          node --check electron/preload.js
          node --check electron/modules/preload-bridge.js
          node --check electron/modules/renderer-network.js
          node --check electron/modules/security.js
          node --check electron/modules/window.js
          node --check scripts/dev-smoke-test.cjs

      # These tests are intentionally lightweight so security boundary changes fail fast
      # before CI spends time building the full Electron package.
      - name: Test security boundaries
        run: node --test electron/modules/security.test.js electron/modules/renderer-network.test.js electron/modules/preload-bridge.test.js

      - name: Build
        run: yarn run build

      # A production bundle can compile even when the Electron preload or main process
      # crashes at launch. Strict legacy IPC mode also makes startup fail if the renderer
      # still reaches for the generic compatibility bridge instead of a named preload API.
      - name: Developer Electron smoke test
        env:
          ASCENDARA_STRICT_RENDERER_IPC: "1"
        run: node scripts/dev-smoke-test.cjs

      - name: Build Electron app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          yarn buildwithelectron
