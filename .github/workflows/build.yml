name: Build Ascendara

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark developer build pending
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data '{"state":"pending","context":"ascendara/developer-build","description":"Developer validation is running"}'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clean electron-builder cache
        run: rm -rf ~/.cache/electron-builder/appimage

      - name: Install dependencies
        run: yarn install

      # Keep this before the tests so a retired privileged bridge cannot quietly
      # return while its runtime behavior still happens to pass unit tests.
      - name: Audit renderer security boundaries
        run: node scripts/security-audit.cjs

      # Syntax-check the files that sit on the renderer/main privilege boundary before
      # running tests. A malformed preload is much easier to diagnose here than as a
      # blank Electron window later in the build.
      - name: Check Electron security syntax
        run: |
          node --check electron/preload.js
          node --check electron/modules/preload-bridge.js
          node --check electron/modules/renderer-network.js
          node --check electron/modules/security.js
          node --check electron/modules/window.js
          node --check scripts/dev-smoke-test.cjs

      # These tests are intentionally lightweight so security boundary changes fail fast
      # before CI spends time building the full Electron package.
      - name: Test security boundaries
        run: node --test electron/modules/security.test.js electron/modules/renderer-network.test.js electron/modules/preload-bridge.test.js electron/preload.api.test.js

      - name: Build
        run: yarn run build

      # The smoke test now verifies the real isolated renderer: React must mount, the
      # preload bridge must exist, Node globals must stay hidden, and startup must not
      # throw. Strict legacy-IPC rejection remains unit-tested until the migration
      # inventory reaches zero; enabling it here earlier would make the gate all-or-nothing.
      - name: Developer Electron smoke test
        run: node scripts/dev-smoke-test.cjs

      - name: Build Electron app
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          yarn buildwithelectron

      # The connector can read commit statuses even when workflow-run discovery is not
      # available. Publishing one result here makes every direct-main change verifiable
      # without weakening or skipping any of the build steps above.
      - name: Publish developer build result
        if: always() && github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          case "${JOB_STATUS}" in
            success)
              STATE="success"
              DESCRIPTION="Developer validation passed"
              ;;
            failure)
              STATE="failure"
              DESCRIPTION="Developer validation failed"
              ;;
            *)
              STATE="error"
              DESCRIPTION="Developer validation did not complete"
              ;;
          esac

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            --data "{\"state\":\"${STATE}\",\"context\":\"ascendara/developer-build\",\"description\":\"${DESCRIPTION}\"}"
