# Keep modern Yarn installs compatible with Ascendara's existing Electron build.
# electron-builder and several helper scripts expect a physical node_modules tree.
nodeLinker: node-modules

# Yarn 4 requires GitHub dependencies to be approved explicitly. Keep this list narrow
# instead of allowing arbitrary Git repositories; this is the one transitive dependency
# currently requested by Ascendara's dependency graph.
approvedGitRepositories:
  - "https://github.com/devsnek/node-register-scheme.git"
